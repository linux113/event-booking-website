# Copy this file to .github/workflows/setup-database.yml to let Actions keep the
# Neon database in step with supabase/ — it applies the prelude, the migrations and
# the seed through the same scripts/setup-database.mjs the local path uses, then
# prints the verification report.
#
# It needs one repository secret, NEON_DATABASE_URL, holding the *direct* connection
# string (Neon → Connect → Direct connection, without `-pooler`).
#
# (It lives in docs/ rather than .github/workflows/ because only the repository owner
# can add workflow files: GitHub refuses App-authored pushes to that path.)
name: Set up database

# Applies supabase/prelude.sql, every migration and (optionally) the seed to the Neon
# database, then prints the verification report. This is exactly what `npm run db:setup`
# does locally — it just runs somewhere whose network can reach Neon.
#
# The connection string lives in the repository secret **NEON_DATABASE_URL**. Use the
# *direct* string (Neon → Connect → Direct connection), not the `-pooler` one: schema
# changes should not travel through a connection pooler. The script masks it in its
# output and the secret is never echoed.
#
# Runs on a manual dispatch from the Actions tab, or on a push that touches supabase/ —
# a migration that lands in the repository is a migration the database should have.
#
# What a first run against an empty database does: prelude → 18 migrations → seed, in
# per-file transactions, recorded in setup.applied_migrations. Running it again applies
# only what is new (or nothing), which is why a push is a safe trigger.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Also apply supabase/seed.sql (idempotent)
        type: boolean
        default: true
      verify_only:
        description: Apply nothing — print the verification report only
        type: boolean
        default: false
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/setup-database.yml"

# One database: never let two of these run against it at once.
concurrency:
  group: database-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A missing secret is a setup step someone forgot, not a failure of the schema, so
      # this notices and stops instead of painting the run red.
      - name: Is NEON_DATABASE_URL configured?
        id: credentials
        env:
          CONNECTION: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$CONNECTION" ]; then
            echo "::notice title=Database setup skipped::Add the repository secret NEON_DATABASE_URL (Neon → Connect → Direct connection, without -pooler) and run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The scripts import node builtins and `postgres` only — they do not need the app's
      # dependencies, so this installs one package instead of the whole tree.
      - name: Install the driver
        if: ${{ steps.credentials.outputs.ready == 'true' }}
        run: npm install --no-save --no-audit --no-fund postgres@3.4.9

      # The verification below assumes the anon role inside a transaction to prove the
      # public boundary. PostgreSQL 16+ gives a CREATEROLE user only ADMIN OPTION on the
      # roles it created, so without this the check fails on `set local role anon` before
      # it reaches a table. Idempotent — safe on every run.
      - name: Make the app roles assumable
        if: ${{ steps.credentials.outputs.ready == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          node --input-type=module -e '
            import postgres from "postgres";
            const sql = postgres(process.env.DATABASE_URL, { max: 1 });
            await sql.unsafe("grant anon, authenticated, service_role to current_user");
            await sql.end();
            console.log("anon, authenticated and service_role are assumable ✓");
          '

      - name: Apply the schema
        if: ${{ steps.credentials.outputs.ready == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.verify_only) }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SEED: ${{ github.event_name != 'workflow_dispatch' || inputs.seed }}
        run: |
          if [ "$SEED" = "true" ]; then
            node scripts/setup-database.mjs --seed
          else
            node scripts/setup-database.mjs
          fi

      - name: Verify
        if: ${{ steps.credentials.outputs.ready == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          node scripts/setup-database.mjs --verify-only
          {
            echo ""
            echo "### Expected on the current schema"
            echo ""
            echo "| what | value |"
            echo "| --- | --- |"
            echo "| public tables | 10 |"
            echo "| policies (public reads only) | 6 |"
            echo "| tables with RLS on | 10 |"
            echo "| security-definer functions | 40 |"
            echo "| recorded sections | 20 (prelude + 18 migrations + seed) |"
            echo "| seed | 1 event, 9 nights, 5 passes, 6 highlights, 6 features |"
          } >> "$GITHUB_STEP_SUMMARY"
