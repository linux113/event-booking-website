# ---------------------------------------------------------------------------
# Copy this file to  .github/workflows/setup-database.yml  to enable it.
#
# It lives here rather than in place because GitHub refuses to let an app push
# `.github/workflows/**` without the `workflows` permission — and no workflow file
# is worth an app permission it does not otherwise need. Two ways to install it:
#
#   GitHub UI   repo → Actions → "New workflow" → "set up a workflow yourself",
#               delete the sample, paste this file, commit.
#   Locally     mkdir -p .github/workflows
#               cp docs/setup-database.workflow.yml .github/workflows/setup-database.yml
#               git add .github/workflows/setup-database.yml && git commit -m "ci: database setup" && git push
#
# Then: repo → Settings → Secrets and variables → Actions → New repository secret
#       name NEON_DATABASE_URL, value = the DIRECT (non-pooler) connection string.
#       Actions → Set up database → Run workflow.
# ---------------------------------------------------------------------------
name: Set up database

# Applies supabase/prelude.sql, every migration and (optionally) the seed to a
# hosted PostgreSQL — Neon, or any Postgres.
#
# Manual only, on purpose: it writes to a real database, so it must never run on a
# push. Run it from the Actions tab, or: gh workflow run "Set up database" -f seed=true
#
# Reads the connection string from the NEON_DATABASE_URL repository secret. GitHub
# masks secrets in logs, and scripts/setup-database.mjs masks the password in its own
# output as well, so neither the secret nor the log leaks it.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Also load supabase/seed.sql (one event, nine nights, five pass types)"
        type: boolean
        default: false
      verify_only:
        description: "Only check what is already there; apply nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: setup-database
  cancel-in-progress: false

jobs:
  apply:
    name: Apply the schema
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check the secret is set
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Missing secret::Add NEON_DATABASE_URL under Settings → Secrets and variables → Actions → New repository secret. Use the DIRECT (non-pooler) connection string, including ?sslmode=require."
            exit 1
          fi
          echo "The secret is set — $(printf '%s' "$DATABASE_URL" | sed -E 's#://([^:/@]+):[^@]*@#://\1:***@#')"

      - name: Apply the prelude and the migrations
        if: ${{ inputs.verify_only == false }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ "${{ inputs.seed }}" = "true" ]; then
            npm run db:setup -- --seed
          else
            npm run db:setup
          fi

      - name: Verify only
        if: ${{ inputs.verify_only == true }}
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npm run db:setup -- --verify-only

      - name: What to look at next
        if: ${{ always() }}
        run: |
          {
            echo "### Database setup finished"
            echo ""
            echo "The step above is the check: 10 public tables, 6 policies, RLS on all 10,"
            echo "44 SECURITY DEFINER functions, the identity shim answering, a stranger able to"
            echo "read the published event and refused on \`bookings\`."
            echo ""
            echo "Re-run with **verify_only** ticked to check without touching anything."
            echo "Re-run with **seed** ticked to load the demo event, nights and pass types."
          } >> "$GITHUB_STEP_SUMMARY"
